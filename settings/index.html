<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      margin: 12px 0;
    }

    .summary-card {
      padding: 10px;
      border-radius: 8px;
      background: rgba(127, 127, 127, 0.12);
    }

    .summary-card strong,
    .summary-card span {
      display: block;
    }

    .summary-card span {
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.8;
    }

    pre {
      max-height: 320px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 12px;
      border-radius: 8px;
      background: rgba(127, 127, 127, 0.12);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header class="homey-header">
    <h1 class="homey-title">BLE Climate Sensors</h1>
    <p class="homey-subtitle">Diagnostics and debugging</p>
  </header>

  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend">Debug logging</legend>

    <div class="homey-form-group">
      <label class="homey-form-checkbox">
        <input id="debug" type="checkbox">
        <span>Enable debug logging</span>
      </label>
      <p class="homey-form-helper">Enables additional parser and device logging.</p>
    </div>
  </fieldset>

  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend">BLE diagnostics</legend>

    <div class="homey-form-group">
      <p class="homey-form-helper">
        Runs one passive central BLE scan. No connection to the devices is established.
        The selected advertisements are written to the app log and shown below.
      </p>

      <div class="button-row">
        <button class="homey-button-primary scan-button" type="button" data-path="/scanBle">
          Scan all devices
        </button>
        <button class="homey-button-secondary scan-button" type="button" data-path="/scanBle/matched">
          Show matched devices
        </button>
        <button class="homey-button-secondary scan-button" type="button" data-path="/scanBle/unknown">
          Show unknown devices
        </button>
      </div>

      <p id="scan-status" class="homey-form-helper" role="status" aria-live="polite"></p>
      <div id="scan-summary" class="summary-grid" hidden></div>
    </div>

    <div class="homey-form-group">
      <button id="copy-result" class="homey-button-secondary" type="button" disabled>
        Copy result as JSON
      </button>
      <pre id="scan-result" hidden></pre>
    </div>
  </fieldset>

  <script>
    function onHomeyReady(Homey) {
      const debugElement = document.getElementById('debug');
      const scanButtons = Array.from(document.querySelectorAll('.scan-button'));
      const scanStatus = document.getElementById('scan-status');
      const scanSummary = document.getElementById('scan-summary');
      const scanResult = document.getElementById('scan-result');
      const copyButton = document.getElementById('copy-result');
      let lastResult = null;

      Homey.get('debug', (error, value) => {
        if (error) {
          Homey.alert(error);
          return;
        }

        debugElement.checked = value === true;
      });

      debugElement.addEventListener('change', () => {
        Homey.set('debug', debugElement.checked, error => {
          if (error) Homey.alert(error);
        });
      });

      function setScanning(scanning) {
        scanButtons.forEach(button => {
          button.disabled = scanning;
        });
      }

      function renderSummary(groups) {
        scanSummary.innerHTML = '';
        const entries = Object.entries(groups || {});
        scanSummary.hidden = entries.length === 0;

        entries
          .sort(([left], [right]) => left.localeCompare(right))
          .forEach(([name, stats]) => {
            const card = document.createElement('div');
            card.className = 'summary-card';

            const title = document.createElement('strong');
            title.textContent = name;

            const details = document.createElement('span');
            details.textContent = `${stats.matched} matched, ${stats.unknown} unknown, ${stats.total} total`;

            card.appendChild(title);
            card.appendChild(details);
            scanSummary.appendChild(card);
          });
      }

      function fallbackCopyText(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        textarea.style.top = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();

        let copied = false;
        try {
          copied = document.execCommand('copy');
        } finally {
          document.body.removeChild(textarea);
        }

        return copied;
      }

      async function copyText(text) {
        if (
          navigator.clipboard &&
          typeof navigator.clipboard.writeText === 'function'
        ) {
          await navigator.clipboard.writeText(text);
          return true;
        }

        return fallbackCopyText(text);
      }

      scanButtons.forEach(button => {
        button.addEventListener('click', () => {
          setScanning(true);
          scanStatus.textContent = 'Scanning for BLE advertisements…';
          scanSummary.hidden = true;
          scanResult.hidden = true;
          copyButton.disabled = true;

          Homey.api('GET', button.dataset.path, {}, (error, result) => {
            setScanning(false);

            if (error) {
              scanStatus.textContent = `BLE scan failed: ${error.message || error}`;
              Homey.alert(error);
              return;
            }

            lastResult = result;
            const count = result && typeof result.count === 'number' ? result.count : 0;
            const total = result && typeof result.total === 'number' ? result.total : count;
            scanStatus.textContent = `Scan completed. ${count} of ${total} advertisement(s) were written to the app log.`;
            renderSummary(result?.groups);
            scanResult.textContent = JSON.stringify(result, null, 2);
            scanResult.hidden = false;
            copyButton.disabled = false;
          });
        });
      });

      copyButton.addEventListener('click', async () => {
        if (!lastResult) return;

        const text = JSON.stringify(lastResult, null, 2);

        try {
          const copied = await copyText(text);
          if (!copied) throw new Error('Clipboard access is not available in this Homey view.');
          scanStatus.textContent = 'BLE scan result copied to the clipboard.';
        } catch (error) {
          scanStatus.textContent = 'Could not copy automatically. Select the JSON result below and copy it manually.';
          scanResult.hidden = false;
          Homey.alert(error.message || error);
        }
      });

      Homey.ready();
    }
  </script>
</body>
</html>
